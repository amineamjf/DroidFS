name: cipher-core-tests

# Fast check (no NDK, no submodules): compiles the `cipher` package together with its JUnit
# tests using the Kotlin compiler directly and runs them on a JVM.
# It validates the crypto logic only. It does NOT replace the Gradle/Android build
# (see build-apk.yml) and does not run on Android's crypto provider.

on:
  push:
    branches: [amin-cipher-android]
    paths:
      - 'app/src/main/java/sushi/hardcore/droidfs/cipher/**'
      - 'app/src/test/**'
      - '.github/workflows/cipher-core-tests.yml'
  pull_request:
    paths:
      - 'app/src/main/java/sushi/hardcore/droidfs/cipher/**'
      - 'app/src/test/**'
      - '.github/workflows/cipher-core-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch Kotlin compiler and JUnit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/tools"
          curl -fsSL -o junit.jar https://repo1.maven.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -fsSL -o hamcrest.jar https://repo1.maven.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar
          echo "8ac9e16d933b6fb43bc7f576336b8f4d7eb5ba12  junit.jar" | sha1sum -c -
          echo "42a25dc3219429f0e5d060061f71acb49bf010a0  hamcrest.jar" | sha1sum -c -
          BC=1.87
          curl -fsSL -o bcprov.jar "https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk18on/$BC/bcprov-jdk18on-$BC.jar"
          curl -fsSL -o bcprov.jar.sha1 "https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk18on/$BC/bcprov-jdk18on-$BC.jar.sha1"
          echo "$(cat bcprov.jar.sha1)  bcprov.jar" | sha1sum -c -
          curl -fsSL -o kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q kotlin.zip

      - name: Compile
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/tools"
          "$T/kotlinc/bin/kotlinc" -jvm-target 17 -cp "$T/junit.jar:$T/hamcrest.jar:$T/bcprov.jar" \
            -d "$RUNNER_TEMP/out" \
            app/src/main/java/sushi/hardcore/droidfs/cipher/*.kt \
            app/src/test/java/sushi/hardcore/droidfs/cipher/*.kt

      - name: Run tests
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/tools"
          classes=$(cd app/src/test/java && find sushi/hardcore/droidfs/cipher -name '*Test.kt' | sed 's/\.kt$//; s#/#.#g')
          echo "Test classes: $classes"
          java -cp "$RUNNER_TEMP/out:$T/kotlinc/lib/kotlin-stdlib.jar:$T/junit.jar:$T/hamcrest.jar:$T/bcprov.jar" \
            org.junit.runner.JUnitCore $classes
